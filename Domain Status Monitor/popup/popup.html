<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="dark light" />
        <title>Domain Status Monitor</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <svg
            class="icon-sprite"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >
            <symbol id="icon-auto" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="13" rx="2" />
                <path d="M8 21h8m-4-4v4" />
            </symbol>
            <symbol id="icon-light" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
                />
            </symbol>
            <symbol id="icon-dark" viewBox="0 0 24 24">
                <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
            </symbol>
            <symbol id="icon-check" viewBox="0 0 24 24">
                <path d="m5 12 4 4L19 6" />
            </symbol>
            <symbol id="icon-globe" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <ellipse cx="12" cy="12" rx="4" ry="9" />
                <path d="M3 12h18" />
            </symbol>
            <symbol id="icon-reload" viewBox="0 0 24 24">
                <path d="M3 11a9 9 0 0 1 15.74-5.26L21 8M21 3v5h-5" />
                <path d="M21 13a9 9 0 0 1-15.74 5.26L3 16M8 16H3v5" />
            </symbol>
            <symbol id="icon-trash" viewBox="0 0 24 24">
                <path d="M3 6h18M10 11v6m4-6v6" />
                <path
                    d="M5 6l1 14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-14M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"
                />
            </symbol>
        </svg>

        <div class="popup">
            <header class="header">
                <div class="brand">
                    <span class="brand-mark">
                        <svg
                            class="icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M3 12h4l3-7 4 14 3-7h4" />
                        </svg>
                    </span>
                    <div>
                        <h1>Domain Status Monitor</h1>
                        <p class="subtitle" data-i18n="networkActivity"></p>
                    </div>
                </div>

                <div class="theme-control">
                    <button
                        id="themeBtn"
                        class="theme-btn"
                        type="button"
                        aria-haspopup="menu"
                        aria-expanded="false"
                        aria-controls="themeMenu"
                    >
                        <svg class="icon" aria-hidden="true">
                            <use id="themeIcon" href="#icon-auto" />
                        </svg>
                        <span id="themeLabel"></span>
                        <svg
                            class="icon chevron"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="m8 10 4 4 4-4" />
                        </svg>
                    </button>
                    <div
                        id="themeMenu"
                        class="theme-menu"
                        role="menu"
                        data-i18n-label="appearance"
                        hidden
                    >
                        <button
                            class="theme-option"
                            type="button"
                            role="menuitemradio"
                            data-theme-choice="auto"
                            aria-checked="true"
                            tabindex="-1"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="#icon-auto" />
                            </svg>
                            <span data-i18n="themeAuto"></span>
                            <svg class="icon theme-check" aria-hidden="true">
                                <use href="#icon-check" />
                            </svg>
                        </button>
                        <button
                            class="theme-option"
                            type="button"
                            role="menuitemradio"
                            data-theme-choice="light"
                            aria-checked="false"
                            tabindex="-1"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="#icon-light" />
                            </svg>
                            <span data-i18n="themeLight"></span>
                            <svg class="icon theme-check" aria-hidden="true">
                                <use href="#icon-check" />
                            </svg>
                        </button>
                        <button
                            class="theme-option"
                            type="button"
                            role="menuitemradio"
                            data-theme-choice="dark"
                            aria-checked="false"
                            tabindex="-1"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="#icon-dark" />
                            </svg>
                            <span data-i18n="themeDark"></span>
                            <svg class="icon theme-check" aria-hidden="true">
                                <use href="#icon-check" />
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <section class="overview">
                <div class="target-bar">
                    <span class="site-icon">
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-globe" />
                        </svg>
                    </span>
                    <div class="site-info">
                        <span class="eyebrow" data-i18n="currentTab"></span>
                        <p id="siteName" class="site-name"></p>
                    </div>
                    <button
                        id="reloadBtn"
                        class="reload-btn"
                        type="button"
                        data-i18n-label="reloadPage"
                    >
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-reload" />
                        </svg>
                        <span data-i18n="checkAgain"></span>
                    </button>
                </div>
                <div class="summary">
                    <button
                        class="stat"
                        type="button"
                        data-tab="domains"
                        data-target="successGroup"
                        aria-controls="successGroup"
                        disabled
                    >
                        <span id="successCount" class="stat-value success-value">0</span>
                        <span class="stat-label">
                            <span class="status-dot success-dot"></span>
                            <span data-i18n="availableDomains"></span>
                        </span>
                    </button>
                    <button
                        class="stat"
                        type="button"
                        data-tab="domains"
                        data-target="errorGroup"
                        aria-controls="errorGroup"
                        disabled
                    >
                        <span id="errorCount" class="stat-value error-value">0</span>
                        <span class="stat-label">
                            <span class="status-dot error-dot"></span>
                            <span data-i18n="unavailableDomains"></span>
                        </span>
                    </button>
                    <button
                        class="stat"
                        type="button"
                        data-tab="routes"
                        data-target="routesGroup"
                        aria-controls="routesGroup"
                        disabled
                    >
                        <span id="routesCount" class="stat-value">0</span>
                        <span class="stat-label" data-i18n="tabRoutes"></span>
                    </button>
                </div>
            </section>

            <div class="tabs" role="tablist" data-i18n-label="networkActivity">
                <button
                    id="domainsTabBtn"
                    class="tab-btn active"
                    type="button"
                    role="tab"
                    data-tab="domains"
                    aria-selected="true"
                    aria-controls="domainsTab"
                >
                    <span data-i18n="tabDomains"></span>
                    <span id="domainsTabCount" class="tab-count">0</span>
                </button>
                <button
                    id="routesTabBtn"
                    class="tab-btn"
                    type="button"
                    role="tab"
                    data-tab="routes"
                    aria-selected="false"
                    aria-controls="routesTab"
                    tabindex="-1"
                >
                    <span data-i18n="tabRoutes"></span>
                    <span id="routesTabCount" class="tab-count">0</span>
                </button>
            </div>

            <main class="content">
                <section id="emptyState" class="empty-state" hidden>
                    <span class="empty-icon">
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-globe" />
                        </svg>
                    </span>
                    <h2 data-i18n="emptyTitle"></h2>
                    <p data-i18n="emptyDomains"></p>
                </section>

                <div
                    id="domainsTab"
                    class="tab-content active"
                    role="tabpanel"
                    aria-labelledby="domainsTabBtn"
                    tabindex="0"
                >
                    <section
                        id="successGroup"
                        class="list-group"
                        aria-labelledby="availableTitle"
                        tabindex="-1"
                        hidden
                    >
                        <div class="title-row">
                            <h2>
                                <span class="status-dot success-dot"></span>
                                <span id="availableTitle" data-i18n="availableDomains"></span>
                            </h2>
                            <button
                                id="copyAvailableBtn"
                                class="image-btn"
                                type="button"
                                data-i18n-label="copyAllDomains"
                            ></button>
                        </div>
                        <ul id="successList" class="domain-list"></ul>
                    </section>
                    <section
                        id="errorGroup"
                        class="list-group"
                        aria-labelledby="unavailableTitle"
                        tabindex="-1"
                        hidden
                    >
                        <div class="title-row">
                            <h2>
                                <span class="status-dot error-dot"></span>
                                <span id="unavailableTitle" data-i18n="unavailableDomains"></span>
                            </h2>
                            <button
                                id="copyUnavailableBtn"
                                class="image-btn"
                                type="button"
                                data-i18n-label="copyAllDomains"
                            ></button>
                        </div>
                        <ul id="errorList" class="domain-list"></ul>
                    </section>
                </div>
                <div
                    id="routesTab"
                    class="tab-content"
                    role="tabpanel"
                    aria-labelledby="routesTabBtn"
                    tabindex="0"
                    hidden
                >
                    <section
                        id="routesGroup"
                        class="list-group"
                        aria-labelledby="routesTitle"
                        tabindex="-1"
                        hidden
                    >
                        <div class="title-row">
                            <h2 id="routesTitle" data-i18n="requestRoutes"></h2>
                            <button
                                id="copyRoutesBtn"
                                class="image-btn"
                                type="button"
                                data-i18n-label="copyAllRoutes"
                            ></button>
                        </div>
                        <ul id="routesList" class="domain-list"></ul>
                    </section>
                </div>
            </main>

            <footer class="footer">
                <span class="footer-note">
                    <span id="extensionVersion"></span>
                    <span class="status-dot"></span>
                    <span data-i18n="tabDataOnly"></span>
                </span>
                <button
                    id="resetStorageBtn"
                    class="reset-btn"
                    type="button"
                    data-i18n-label="resetStorage"
                >
                    <svg class="icon" aria-hidden="true">
                        <use href="#icon-trash" />
                    </svg>
                    <span data-i18n="resetData"></span>
                </button>
            </footer>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
